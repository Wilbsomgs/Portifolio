spring.application.name=demo

# Banco: H2 em arquivo para desenvolvimento. Em produção use PostgreSQL via DB_URL, DB_USER e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/portfolio}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Administrador (único usuário que pode alterar conteúdo). Sem ADMIN_PASSWORD a aplicação não inicia.
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD}

# Origens do front-end autorizadas a chamar a API (CORS)
app.cors-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000}

# Arquivo estático que o site lê (content.js). Regenerado a cada alteração na administração.
# O caminho é relativo à pasta onde o back-end roda (backend/backend/demo).
app.export-file=${EXPORT_FILE:../../../frontend/content.js}

# Currículo em PDF servido em GET /api/curriculo. O arquivo fica em src/main/resources/static.
app.cv-file=${CV_FILE:static/curriculo.pdf}
# Nome com que o arquivo é baixado pelo visitante.
app.cv-download-name=${CV_DOWNLOAD_NAME:Curriculo-Wilbsom-Goncalves-da-Silva.pdf}